apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: infra-tools
spec:
  project: default
  source:
    repoURL: oci://registry-1.docker.io/bitnamicharts
    chart: postgresql
    targetRevision: "14.0.0"
    helm:
      releaseName: postgres
      values: |
        auth:
          username: mlflow
          database: mlflow

        primary:
          persistence:
            enabled: false

        service:
          type: ClusterIP
          ports:
            postgresql: 5432
  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
