apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: infra-tools
spec:
  project: default
  source:
    repoURL: https://github.com/bitnami/charts.git
    targetRevision: postgresql/17.0.1
    path: bitnami/postgresql
    helm:
      releaseName: postgres
      values: |
        image:
          registry: docker.io
          repository: bitnamilegacy/postgresql
          tag: 17.6.0-debian-12-r0

        auth:
          username: mlflow
          database: mlflow

        architecture: standalone

        primary:
          persistence:
            enabled: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

        readReplicas:
          replicaCount: 0

        metrics:
          enabled: false

        service:
          type: ClusterIP
          ports:
            postgresql: 5432
  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
